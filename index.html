<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141817">
  <title>生活メンテナンス</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header"><div><p class="eyebrow">WEEKLY ROUTINE</p><h1>生活メンテナンス<span class="dot">.</span></h1><p class="subtitle">少しずつ、暮らしを整える。</p></div><button id="add-task" class="primary">＋ 習慣を追加</button></header>
    <section class="week-panel" aria-label="週の選択">
      <div class="week-top"><span id="week-label" class="eyebrow"></span><button id="this-week" class="quiet">今週に戻る</button></div>
      <div class="week-navigation"><button id="previous-week" aria-label="前の週">←<span> 前の週</span></button><h2 id="week-range"></h2><button id="next-week" aria-label="次の週"><span>次の週 </span>→</button></div>
      <div class="overview"><span id="summary"></span><span id="summary-detail"></span></div><div class="summary-track"><div id="summary-fill"></div></div>
    </section>
    <div class="section-heading"><h2>今週の習慣</h2><span>曜日を押してチェック</span></div>
    <div id="tasks" class="tasks"></div>
    <p id="status" role="status" aria-live="polite"></p>
    <footer>自分のペースで。できた日を、ひとつずつ。<span>データはこのブラウザーに保存されます</span></footer>
  </main>
  <dialog id="task-dialog">
    <form id="task-form">
      <div class="dialog-heading"><h2 id="dialog-title">習慣を追加</h2><button type="button" id="close-dialog" class="quiet" aria-label="閉じる">✕</button></div>
      <label>タスク名<input id="task-name" required maxlength="100" placeholder="例：自炊する"></label>
      <label>メモ <span class="optional">任意</span><textarea id="task-note" maxlength="1000" rows="3" placeholder="気軽に続けるためのメモ"></textarea></label>
      <div class="form-row"><label>種類<select id="task-type"><option value="daily">毎日</option><option value="weekly">週○回</option></select></label><label id="target-field">目標回数<input id="task-target" type="number" min="1" max="7" value="3" required></label></div>
      <label>表示順<input id="task-order" type="number" min="1" max="9999" required><span class="hint">小さい数字から順に表示します</span></label>
      <div class="form-actions"><button type="button" id="delete-task" class="danger">削除</button><button type="button" id="cancel-dialog">キャンセル</button><button class="primary" type="submit">保存</button></div>
    </form>
  </dialog>
</body>
</html>
